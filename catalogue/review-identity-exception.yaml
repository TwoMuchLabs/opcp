# Capability contract: a person reviews an identity case that automated checks could not decide.
opcp_version: "0.1"
id: review-identity-exception
version: 1.0.0
name: Review identity exception
archetype: human_task
description: A trained reviewer decides an identity case referred by automated checks, within an SLA.
rclass: R0
data_classification: confidential
evidence_required: true
service_level:
  latency_ms_p95: 14400000   # 4 hours
input:
  type: object
  required: [case_ref, referral_reason]
  properties:
    case_ref: {type: string}
    referral_reason: {type: string}
    prior_checks: {type: array, items: {type: object}}
output:
  type: object
  required: [outcome, assignee_role, completed_at]
  properties:
    outcome: {enum: [pass, fail, request_more_information]}
    assignee_role: {type: string}
    completed_at: {type: string, format: date-time}
mappings:
  apqc_pcf: null           # To map against the PCF download, with its attribution; see docs/TAXONOMIES.md.
  bian_service_domain:
    ref: Customer Case
    version: "14.0.0"
    relation: partial
    source: https://github.com/bian-official/public/blob/b58bf4c2c300dd018afc084e9bb24b7adaaa3500/release14.0.0/semantic-apis/oas3%20/yamls/CustomerCase.yaml
    note: A human review of a failed check, handled as one case. Customer Case Management is the other candidate, but it manages case load and resources across cases, not the case itself.
examples:
  - name: Low-confidence match
    input: {case_ref: IDV-2026-000981, referral_reason: low_confidence}
