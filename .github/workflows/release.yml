name: Release

# Runs when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0),
# or by hand from the Actions tab ("Run workflow") with an existing or new tag.
#
# Every job is safe to re-run. A re-run for an existing tag builds that tag's commit (not
# the current main), refreshes the GitHub release instead of failing because it exists,
# and never changes a file already published under the version. See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.2.0 (if it does not exist, it is created on main: start the run from main)"
        required: true
      prerelease:
        description: "Mark as a pre-release (applies when the release is created; an existing release keeps its setting)"
        type: boolean
        default: true
      publish_pypi:
        description: "Also publish to PyPI (needs the trusted publisher set up, see docs/RELEASING.md)"
        type: boolean
        default: false

permissions:
  contents: read

# One release run per tag at a time; a second run waits rather than racing the first.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # The release tooling always comes from this workflow's own commit, so an older tag can be
  # re-released with the current, idempotent tooling. The release source is checked out separately.
  TOOL: ${{ github.workspace }}/release-tools/tools/release/release.py

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: release-tools
          sparse-checkout: tools/release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve the commit to release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$TOOL" resolve --tag "$TAG" --fallback "$GITHUB_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          path: source
      - name: Check tag, versions, changelog and release notes before building
        id: version
        working-directory: source
        run: python "$TOOL" preflight "$TAG"
      - name: Build
        working-directory: source
        run: |
          # Pin file timestamps to the commit, so rebuilds of one commit on one runner image match.
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python -m pip install --upgrade pip build
          python -m build
      - name: Use PyPI's files if this version is already published
        working-directory: source
        run: python "$TOOL" adopt-pypi --dist dist --version "${{ steps.version.outputs.version }}"
      - name: Test the wheel that will be released
        working-directory: source
        run: |
          pip install dist/*.whl pytest
          # tests/test_installed_wheel.py fails if the tests import the source tree instead of the wheel.
          OPCP_EXPECT_INSTALLED=1 pytest -q -p no:cacheprovider
      - name: Build the downloadable form and example report
        working-directory: source
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir -p assets
          opcp scorecard form "assets/opcp-exit-readiness-form-$v.html"
          opcp scorecard run examples/example-bank-answers.yaml -o "assets/opcp-example-report-$v.html"
          opcp scorecard readout examples/example-bank-answers.yaml -o "assets/opcp-example-readout-$v.html"
          cp dist/*.whl dist/*.tar.gz assets/
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: source/assets/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: source/dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: release-tools
          sparse-checkout: tools/release
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          path: source
          sparse-checkout: docs/releases
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Create the release, or refresh it if it exists
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'true' }}
        run: |
          flags=""
          [ "$PRERELEASE" = "true" ] && flags="--prerelease"
          python "$TOOL" github-release --tag "$TAG" --target "${{ needs.build.outputs.sha }}" \
            --title "OPCP $TAG" --notes "source/docs/releases/$TAG.md" --assets assets $flags

  pypi:
    # Last: PyPI cannot be undone, so it runs only after the GitHub release succeeded.
    needs: [build, github-release]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_pypi == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/opcp
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: release-tools
          sparse-checkout: tools/release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Compare with what PyPI already holds
        id: check
        run: python "$TOOL" pypi-check --dist dist --version "${{ needs.build.outputs.version }}"
      - if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Safe here: pypi-check has already refused any file PyPI holds with different contents,
          # so only files PyPI holds byte-for-byte are skipped.
          skip-existing: true
