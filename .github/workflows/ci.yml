name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Test
        run: pytest -q
      - name: Test the offline form in a real browser
        if: matrix.python-version == '3.13'
        # Uses the runner's installed Chrome; no browser download.
        run: |
          pip install playwright
          pytest -q tests/test_question_bank.py -k browser -rs
      - name: Smoke-test the scorecard
        run: |
          cd "$RUNNER_TEMP"
          opcp scorecard form
          opcp scorecard example
          opcp scorecard run example-assessment.yaml -o report.html
          opcp demo > /dev/null
