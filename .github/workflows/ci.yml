name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Test
        run: pytest -q
      - name: Test the offline form in a real browser
        if: matrix.python-version == '3.13'
        # Uses the runner's installed Chrome; no browser download.
        run: |
          pip install playwright
          pytest -q tests/test_question_bank.py -k browser -rs
      - name: Smoke-test the scorecard
        run: |
          cd "$RUNNER_TEMP"
          opcp scorecard form
          opcp scorecard example
          opcp scorecard run example-assessment.yaml -o report.html
          opcp demo > /dev/null
